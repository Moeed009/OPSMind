name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opsmind
          POSTGRES_PASSWORD: opsmind
          POSTGRES_DB: opsmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsmind -d opsmind_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://opsmind:opsmind@localhost:5432/opsmind_test
      APP_DATABASE_URL: postgresql+psycopg://opsmind_app:opsmind_app@localhost:5432/opsmind_test
      TEST_DATABASE_URL: postgresql+psycopg://opsmind:opsmind@localhost:5432/opsmind_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://opsmind_app:opsmind_app@localhost:5432/opsmind_test
      REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: opsmind
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Create application database role
        run: |
          psql "postgresql://opsmind@localhost:5432/opsmind_test" -v ON_ERROR_STOP=1 -c "CREATE ROLE opsmind_app LOGIN PASSWORD 'opsmind_app' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;"
          psql "postgresql://opsmind@localhost:5432/opsmind_test" -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE opsmind_test TO opsmind_app; GRANT USAGE ON SCHEMA public TO opsmind_app;"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migrations match models
        run: uv run alembic check

      - name: Test
        env:
          CONNECTOR_ENCRYPTION_KEYS: '{"test-v1":"b3BzbWluZC10ZXN0LW9ubHktMzItYnl0ZS1rZXktMDE="}'
          CONNECTOR_ENCRYPTION_CURRENT_KEY_ID: test-v1
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test